<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Finger Ninja</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap');

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: linear-gradient(135deg, #FFA500, #FF4500);
    font-family:'Nunito',sans-serif;
    overflow:hidden;
    width:100vw; height:100vh;
    touch-action:none;
  }

  #container { position:relative; width:100vw; height:100vh; }

  /* Live camera = fullscreen background */
  #videoEl {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    object-fit:cover;
    transform:scaleX(-1);
    z-index:0;
  }

  /* Game overlay canvas - transparent so camera shows through */
  #gameCanvas {
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    z-index:1;
  }

  /* HUD */
  #ui {
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:flex-start;
    padding:18px 24px;
    pointer-events:none;
    z-index:10;
  }

  #scoreBox { display:flex; flex-direction:column; align-items:flex-start; }

  .label {
    font-family:'Fredoka One',cursive;
    font-size:11px; letter-spacing:3px;
    color:rgba(255,255,255,0.75);
    text-transform:uppercase;
    text-shadow:0 1px 6px #000, 0 0 12px #000;
  }

  #score {
    font-family:'Fredoka One',cursive;
    font-size:58px; color:#fff; line-height:1;
    text-shadow:0 0 28px rgba(255,220,80,0.55), 0 2px 14px #000;
  }

  #comboDisplay {
    font-family:'Fredoka One',cursive;
    font-size:26px; color:#ff6b35; min-height:34px; margin-top:2px;
    text-shadow:0 0 14px rgba(255,107,53,0.9), 0 2px 8px #000;
  }

  #livesBox { display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  #lives { display:flex; gap:6px; }

  .life-icon {
    font-size:30px;
    filter:drop-shadow(0 0 6px rgba(255,80,80,0.85)) drop-shadow(0 2px 6px #000);
    transition:all 0.3s;
  }
  .life-icon.lost {
    filter:grayscale(1) opacity(0.22);
    transform:scale(0.8);
  }

  /* Screens */
  .screen {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:20;
    background:rgba(0,0,0,0.72);
    backdrop-filter:blur(10px);
  }
  .screen.hidden { display:none; }

  .screen-title {
    font-family:'Fredoka One',cursive;
    font-size:clamp(46px,9vw,92px);
    color:#fff; text-align:center; line-height:1;
    text-shadow:0 0 60px rgba(255,200,50,0.35);
    margin-bottom:10px;
  }
  .screen-title span {
    background:linear-gradient(135deg,#ffdc50,#ff6b35,#ff3a5c);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
  }

  .screen-sub {
    font-size:17px; color:rgba(255,255,255,0.5);
    text-align:center; max-width:380px;
    line-height:1.65; margin-bottom:36px;
  }

  .btn {
    font-family:'Fredoka One',cursive;
    font-size:21px; padding:15px 46px;
    border:none; border-radius:50px; cursor:pointer;
    background:linear-gradient(135deg,#ffdc50,#ff6b35);
    color:#1a0500; letter-spacing:1px;
    box-shadow:0 8px 28px rgba(255,140,40,0.45);
    transition:all 0.18s; pointer-events:all;
    animation:pulse 2.2s infinite;
  }
  .btn:hover { transform:scale(1.06) translateY(-2px); }
  .btn:active { transform:scale(0.96); }

  @keyframes pulse {
    0%,100% { box-shadow:0 8px 28px rgba(255,140,40,0.45), 0 0 0 0 rgba(255,140,40,0); }
    50%      { box-shadow:0 8px 28px rgba(255,140,40,0.45), 0 0 0 14px rgba(255,140,40,0); }
  }

  #gameOverScore {
    font-family:'Fredoka One',cursive; font-size:40px;
    color:#ffdc50; margin-bottom:6px;
    text-shadow:0 0 24px rgba(255,220,80,0.6);
  }
  #highScoreDisplay {
    font-size:15px; color:rgba(255,255,255,0.36); margin-bottom:32px;
  }

  #camStatus {
    position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
    font-size:12px; color:rgba(255,255,255,0.35);
    letter-spacing:2px; text-transform:uppercase;
    z-index:10; pointer-events:none;
    text-shadow:0 1px 4px #000;
    white-space:nowrap;
  }
  #camStatus.ready { color:rgba(100,255,150,0.7); }

  .loading-ring {
    width:54px; height:54px;
    border:4px solid rgba(255,255,255,0.1);
    border-top-color:#ffdc50;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:20px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #instructions {
    display:flex; gap:26px; margin-top:26px;
    flex-wrap:wrap; justify-content:center;
  }
  .inst-item {
    display:flex; flex-direction:column;
    align-items:center; gap:6px;
    color:rgba(255,255,255,0.44);
    font-size:12px; letter-spacing:1px; text-transform:uppercase;
  }
  .inst-icon { font-size:32px; }
</style>
</head>
<body>
<div id="container">

  <video id="videoEl" autoplay muted playsinline></video>
  <canvas id="gameCanvas"></canvas>

  <div id="ui">
    <div id="scoreBox">
      <div class="label">Score</div>
      <div id="score">0</div>
      <div id="comboDisplay"></div>
    </div>
    <div id="livesBox">
      <div class="label">Lives</div>
      <div id="lives">
        <span class="life-icon" id="life1">❤️</span>
        <span class="life-icon" id="life2">❤️</span>
        <span class="life-icon" id="life3">❤️</span>
      </div>
    </div>
  </div>

  <div id="camStatus">Waiting for start...</div>

  <div class="screen" id="startScreen">
    <div class="screen-title">🍉 <span>Finger Ninja</span> 🔪</div>
    <p class="screen-sub">Fruits fly over your live camera feed.<br>Slice with your index finger — dodge 💣 bombs!</p>
    <div id="instructions">
      <div class="inst-item"><span class="inst-icon">☝️</span>Index finger</div>
      <div class="inst-item"><span class="inst-icon">⚡</span>Swipe fast</div>
      <div class="inst-item"><span class="inst-icon">💣</span>Dodge bombs</div>
    </div>
    <br><br>
    <button class="btn" id="startBtn">Start Game</button>
    <p style="margin-top:14px;font-size:12px;color:rgba(255,255,255,0.18);">Requires webcam · MediaPipe Hands</p>
  </div>

  <div class="screen hidden" id="loadingScreen">
    <div class="loading-ring"></div>
    <div class="screen-title" style="font-size:32px;">Loading…</div>
    <p class="screen-sub">Starting hand tracking & camera</p>
  </div>

  <div class="screen hidden" id="gameOverScreen">
    <div class="screen-title"><span>Game Over</span></div>
    <div id="gameOverScore">Score: 0</div>
    <div id="highScoreDisplay">Best: 0</div>
    <button class="btn" id="restartBtn">Play Again</button>
  </div>

</div>


<script>
'use strict';

// ── Safe element getter (null-safe) ──────────────────────────────────────────
function el(id) { return document.getElementById(id); }
function showEl(id)  { const e=el(id); if(e) e.classList.remove('hidden'); }
function hideEl(id)  { const e=el(id); if(e) e.classList.add('hidden'); }
function setText(id,t){ const e=el(id); if(e) e.textContent=t; }

// ── Canvas ────────────────────────────────────────────────────────────────────
const canvas  = el('gameCanvas');
const ctx     = canvas.getContext('2d');
const videoEl = el('videoEl');

function resizeCanvas() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ── Game state ────────────────────────────────────────────────────────────────
const state = {
  running:    false,
  score:      0,
  lives:      3,
  highScore:  parseInt(localStorage.getItem('fn_hs') || '0'),
  combo:      0,
  comboTimer: null,
  spawnTimer: null,
  diffTimer:  null,
  difficulty: 1,
};

// ── Fruit catalogue ───────────────────────────────────────────────────────────
const FRUITS = [
  {emoji:'🍎',points:10,color:'#e74c3c',r:38},
  {emoji:'🍊',points:10,color:'#e67e22',r:36},
  {emoji:'🍋',points:15,color:'#f1c40f',r:32},
  {emoji:'🍇',points:20,color:'#8e44ad',r:38},
  {emoji:'🍓',points:15,color:'#c0392b',r:30},
  {emoji:'🍉',points:25,color:'#2ecc71',r:46},
  {emoji:'🍌',points:20,color:'#f9ca24',r:38},
  {emoji:'🍑',points:15,color:'#fd9644',r:34},
  {emoji:'🥝',points:20,color:'#6ab04c',r:32},
  {emoji:'🫐',points:30,color:'#4834d4',r:30},
];

let fruits      = [];
let particles   = [];
let slashTrail  = [];
let scorePopups = [];

// ── Finger tracking ───────────────────────────────────────────────────────────
const finger = { x:-200, y:-200, px:-200, py:-200, tx:-200, ty:-200, speed:0 };

let handReady = false;
let cameraInitialized = false;

const SPEED_CAP = 70;  // clamp per-frame delta to stop touch-batch spikes
const SLICE_MIN = 9;   // minimum speed to register a slice

function updateFingerTarget(nx, ny) {
  finger.tx = nx;
  finger.ty = ny;
}

// ── Audio ─────────────────────────────────────────────────────────────────────
let audioCtx = null;

function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function beep(freq, type, dur, vol, freqEnd) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination);
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, audioCtx.currentTime + dur);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) { /* silent fail */ }
}

const playSlice = () => beep(880, 'sawtooth', 0.12, 0.18, 200);
const playBomb  = () => beep(120, 'square',   0.50, 0.35, 40);
const playMiss  = () => beep(300, 'sine',     0.28, 0.15, 90);

// ── Physics constants ─────────────────────────────────────────────────────────
const GRAVITY = 0.22;

// ── Spawn ─────────────────────────────────────────────────────────────────────
function spawnFruit() {
  if (!state.running) return;
  const W = canvas.width, H = canvas.height;
  const isBomb = Math.random() < 0.11 + state.difficulty * 0.018;
  const def    = isBomb ? null : FRUITS[Math.floor(Math.random() * FRUITS.length)];
  const r      = isBomb ? 34 : def.r;
  const x      = r + Math.random() * (W - r * 2);
  const vx     = (Math.random() - 0.5) * 5 * state.difficulty;
  const vy     = -(H * 0.015 + Math.random() * H * 0.012) * state.difficulty;

  fruits.push({
    x, y: H + r + 10,
    vx, vy,
    r,
    rot:      Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.1,
    isBomb, def,
    emoji:    isBomb ? '💣' : def.emoji,
    color:    isBomb ? '#555' : def.color,
    sliced:   false,
    halfA:    null,
    halfB:    null,
    halfAlpha:1,
  });
}

function scheduleSpawn() {
  if (!state.running) return;
  const delay = Math.max(480, 1350 - state.difficulty * 75);
  state.spawnTimer = setTimeout(() => {
    spawnFruit();
    if (Math.random() < 0.28 + state.difficulty * 0.05) {
      setTimeout(spawnFruit, 130);
    }
    scheduleSpawn();
  }, delay + Math.random() * 380);
}

// ── Particle / popup effects ──────────────────────────────────────────────────
function spawnParticles(x, y, color) {
  for (let i = 0; i < 22; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 7;
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 2,
      r:  3 + Math.random() * 5,
      color, alpha: 1,
      decay: 0.02 + Math.random() * 0.025,
    });
  }
}

function spawnPopup(x, y, text, color) {
  scorePopups.push({ x, y, text, color: color || '#ffdc50', alpha: 1, vy: -2.5 });
}

// ── Collision: segment vs circle ─────────────────────────────────────────────
function segCircle(x1, y1, x2, y2, cx, cy, r) {
  const dx = x2-x1, dy = y2-y1, l2 = dx*dx + dy*dy;
  if (!l2) return Math.hypot(x1-cx, y1-cy) <= r;
  const t  = Math.max(0, Math.min(1, ((cx-x1)*dx + (cy-y1)*dy) / l2));
  const nx = x1 + t*dx - cx, ny = y1 + t*dy - cy;
  return nx*nx + ny*ny <= r*r;
}

// ── Slice logic ───────────────────────────────────────────────────────────────
function trySlice() {
  if (!state.running || finger.speed < SLICE_MIN) return;
  for (let i = 0; i < fruits.length; i++) {
    const f = fruits[i];
    if (f.sliced) continue;
    if (segCircle(finger.px, finger.py, finger.x, finger.y, f.x, f.y, f.r * 1.1)) {
      f.sliced = true;
      if (f.isBomb) {
        playBomb();
        screenFlash('#ff2020');
        loseLife();
        spawnParticles(f.x, f.y, '#ff4444');
        spawnParticles(f.x, f.y, '#888');
      } else {
        playSlice();
        state.combo++;
        clearTimeout(state.comboTimer);
        state.comboTimer = setTimeout(() => { state.combo = 0; updateComboUI(); }, 1200);
        const mult = Math.max(1, Math.floor(state.combo / 3));
        const pts  = f.def.points * mult;
        state.score += pts;
        updateScoreUI();
        updateComboUI();
        spawnParticles(f.x, f.y, f.color);
        spawnPopup(f.x, f.y, mult > 1 ? `+${pts} ×${mult}` : `+${pts}`, mult > 1 ? '#ff6b35' : '#ffdc50');
        const ang = Math.atan2(finger.y - finger.py, finger.x - finger.px);
        f.halfA = { dx: -Math.sin(ang)*2 - 1, dy:  Math.cos(ang)*2 };
        f.halfB = { dx:  Math.sin(ang)*2 + 1, dy: -Math.cos(ang)*2 };
      }
    }
  }
}

// ── Screen flash ──────────────────────────────────────────────────────────────
let flashAlpha = 0, flashColor = '#fff';
function screenFlash(c) { flashAlpha = 0.7; flashColor = c || '#fff'; }

// ── Lives & UI ────────────────────────────────────────────────────────────────
function loseLife() {
  state.lives--;
  updateLivesUI();
  if (state.lives <= 0) setTimeout(gameOver, 500);
}

function updateLivesUI() {
  for (let i = 1; i <= 3; i++) {
    const icon = el('life' + i);
    if (!icon) continue;   
    if (state.lives < i) {
      icon.classList.add('lost');
    } else {
      icon.classList.remove('lost');
    }
  }
}

function updateScoreUI() {
  setText('score', state.score);
}

function updateComboUI() {
  setText('comboDisplay', state.combo >= 3 ? `🔥 ${state.combo}x COMBO!` : '');
}

function setCamStatus(msg, ready) {
  const s = el('camStatus');
  if (!s) return;
  s.textContent = msg;
  if (ready) s.classList.add('ready');
  else s.classList.remove('ready');
}

// ── Game flow ─────────────────────────────────────────────────────────────────
function startGame() {
  hideEl('startScreen');
  hideEl('gameOverScreen');
  fruits = []; particles = []; slashTrail = []; scorePopups = [];
  state.score = 0; state.lives = 3; state.combo = 0;
  state.difficulty = 1; state.running = true;
  updateScoreUI(); updateLivesUI(); updateComboUI();
  scheduleSpawn();
  clearInterval(state.diffTimer);
  state.diffTimer = setInterval(() => {
    state.difficulty = Math.min(5, state.difficulty + 0.15);
  }, 8000);
}

function gameOver() {
  state.running = false;
  clearTimeout(state.spawnTimer);
  clearInterval(state.diffTimer);
  if (state.score > state.highScore) {
    state.highScore = state.score;
    localStorage.setItem('fn_hs', state.highScore);
  }
  setText('gameOverScore',   'Score: ' + state.score);
  setText('highScoreDisplay', 'Best: '  + state.highScore);
  showEl('gameOverScreen');
}

// ── Draw helpers ──────────────────────────────────────────────────────────────
function drawFruit(f) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.rotate(f.rot);
  ctx.font = (f.r * 2) + 'px serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.emoji, 0, 0);
  ctx.restore();
}

function drawHalf(f, half, alpha) {
  ctx.save();
  ctx.globalAlpha = Math.max(0, alpha);
  ctx.translate(f.x + half.dx * (1 - alpha) * 40,
                f.y + half.dy * (1 - alpha) * 40);
  ctx.rotate(f.rot + (1 - alpha) * 2);
  ctx.font = (f.r * 1.7) + 'px serif';
  ctx.textAlign    = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(f.emoji, 0, 0);
  ctx.restore();
}

function drawTrail() {
  if (slashTrail.length < 2) return;
  
  ctx.save();
  ctx.lineCap = 'round'; 
  ctx.lineJoin = 'round';
  
  for (let i = 1; i < slashTrail.length; i++) {
    const t = i / slashTrail.length;
    const ease = t * t; 
    const w = t * 14; 

    ctx.beginPath();
    ctx.moveTo(slashTrail[i-1].x, slashTrail[i-1].y);
    ctx.lineTo(slashTrail[i].x,   slashTrail[i].y);
    ctx.strokeStyle = `rgba(255, 255, 255, ${ease * 0.35})`; 
    ctx.lineWidth = w;
    ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
    ctx.shadowBlur = 15;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(slashTrail[i-1].x, slashTrail[i-1].y);
    ctx.lineTo(slashTrail[i].x,   slashTrail[i].y);
    ctx.strokeStyle = `rgba(255, 255, 255, ${t * 0.95})`; 
    ctx.lineWidth = w * 0.25; 
    ctx.shadowBlur = 0; 
    ctx.stroke();
  }

  const last = slashTrail[slashTrail.length - 1];
  if (last && handReady) {
    const grd = ctx.createRadialGradient(last.x, last.y, 0, last.x, last.y, 22);
    grd.addColorStop(0,   'rgba(255, 255, 255, 1)');
    grd.addColorStop(0.3, 'rgba(220, 235, 255, 0.6)'); 
    grd.addColorStop(1,   'rgba(255, 255, 255, 0)');

    ctx.beginPath(); 
    ctx.arc(last.x, last.y, 22, 0, Math.PI * 2);
    ctx.fillStyle = grd; 
    ctx.fill();
  }
  
  ctx.restore();
}

// ── Update ────────────────────────────────────────────────────────────────────
function update() {
  const W = canvas.width, H = canvas.height;

  if (handReady) {
    finger.px = finger.x;
    finger.py = finger.y;
    
    finger.x += (finger.tx - finger.x) * 0.5;
    finger.y += (finger.ty - finger.y) * 0.5;
    
    finger.speed = Math.min(Math.hypot(finger.x - finger.px, finger.y - finger.py), SPEED_CAP);
  }

  for (const f of fruits) {
    if (!f.sliced) {
      f.vy += GRAVITY; f.x += f.vx; f.y += f.vy; f.rot += f.rotSpeed;
    } else {
      f.halfAlpha -= 0.018;
      f.vy += GRAVITY; f.x += f.vx * 0.5; f.y += f.vy * 0.3;
    }
  }

  fruits = fruits.filter(f => {
    if (f.sliced && f.halfAlpha <= 0) return false;
    if (!f.sliced && f.y > H + f.r * 2) {
      if (!f.isBomb) { playMiss(); loseLife(); }
      return false;
    }
    if (f.y > H + 200 || f.x < -200 || f.x > W + 200) return false;
    return true;
  });

  particles = particles.filter(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.alpha -= p.decay;
    return p.alpha > 0;
  });

  scorePopups = scorePopups.filter(sp => {
    sp.y += sp.vy; sp.alpha -= 0.022;
    return sp.alpha > 0;
  });

  if (slashTrail.length > 20) slashTrail.shift();
  if (handReady) slashTrail.push({ x: finger.x, y: finger.y });
  else if (slashTrail.length > 0) slashTrail.shift();

  flashAlpha *= 0.87;
}

// ── Draw ──────────────────────────────────────────────────────────────────────
function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H); 

  for (const f of fruits) {
    if (!f.sliced) {
      drawFruit(f);
    } else if (f.halfA && f.halfB) {
      drawHalf(f, f.halfA, f.halfAlpha);
      drawHalf(f, f.halfB, f.halfAlpha);
    }
  }

  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle   = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  for (const sp of scorePopups) {
    ctx.save();
    ctx.globalAlpha      = sp.alpha;
    ctx.font             = "bold 26px 'Fredoka One', cursive";
    ctx.fillStyle        = sp.color;
    ctx.textAlign        = 'center';
    ctx.textBaseline     = 'middle';
    ctx.shadowColor      = sp.color;
    ctx.shadowBlur       = 14;
    ctx.fillText(sp.text, sp.x, sp.y);
    ctx.restore();
  }

  drawTrail();

  if (flashAlpha > 0.01) {
    ctx.save();
    ctx.globalAlpha = flashAlpha;
    ctx.fillStyle   = flashColor;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  if (!handReady && state.running) {
    ctx.save();
    ctx.font        = '15px Nunito';
    ctx.fillStyle   = 'rgba(255,255,255,0.28)';
    ctx.textAlign   = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.95)';
    ctx.shadowBlur  = 10;
    ctx.fillText('☝️  Show your index finger to the camera', W / 2, H - 54);
    ctx.restore();
  }
}

// ── Main loop ─────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  trySlice();
  requestAnimationFrame(loop);
}

// ── MediaPipe setup ───────────────────────────────────────────────────────────
function setupMediaPipe(onReady) {
  showEl('loadingScreen');
  hideEl('startScreen');

  const hands = new Hands({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`
  });
  hands.setOptions({
    maxNumHands:           1,
    modelComplexity:       0,
    minDetectionConfidence:0.6,
    minTrackingConfidence: 0.55,
  });

  hands.onResults(results => {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      handReady = true;
      const lms = results.multiHandLandmarks[0];
      const tip = lms[8]; 
      
      const videoRatio = 640 / 480; 
      const screenRatio = canvas.width / canvas.height;
      let renderWidth, renderHeight, xOffset = 0, yOffset = 0;

      if (screenRatio > videoRatio) {
        renderWidth = canvas.width;
        renderHeight = canvas.width / videoRatio;
        yOffset = (renderHeight - canvas.height) / 2;
      } else {
        renderHeight = canvas.height;
        renderWidth = canvas.height * videoRatio;
        xOffset = (renderWidth - canvas.width) / 2;
      }

      const mappedX = (1 - tip.x) * renderWidth - xOffset;
      const mappedY = tip.y * renderHeight - yOffset;

      updateFingerTarget(mappedX, mappedY);
      setCamStatus('', false);
    } else {
      handReady     = false;
      finger.speed  = 0;
    }
  });

  const camera = new Camera(videoEl, {
    onFrame: async () => { await hands.send({ image: videoEl }); },
    width: 640, height: 480,
  });

  camera.start()
    .then(() => {
      setCamStatus('● Camera active', true);
      hideEl('loadingScreen');
      cameraInitialized = true;
      if (onReady) onReady();
    })
    .catch(err => {
      console.warn('Camera error:', err);
      hideEl('loadingScreen');
      setCamStatus('⚠ Camera unavailable — touch/mouse mode', true);
      cameraInitialized = true;
      if (onReady) onReady();
    });
}

// ── Mouse / touch fallback ────────────────────────────────────────────────────
let lastPtrTime = 0;

function handlePointer(e) {
  const now = performance.now();
  if (now - lastPtrTime < 8) return;
  lastPtrTime = now;

  const rect = canvas.getBoundingClientRect();
  const sx   = canvas.width  / rect.width;
  const sy   = canvas.height / rect.height;
  let cx, cy;

  if (e.touches && e.touches.length > 0) {
    cx = (e.touches[0].clientX - rect.left) * sx;
    cy = (e.touches[0].clientY - rect.top)  * sy;
  } else {
    cx = (e.clientX - rect.left) * sx;
    cy = (e.clientY - rect.top)  * sy;
  }

  updateFingerTarget(cx, cy);
  handReady = true;
}

canvas.addEventListener('mousemove',  handlePointer);
canvas.addEventListener('touchmove',  e => { e.preventDefault(); handlePointer(e); }, { passive: false });
canvas.addEventListener('mouseleave', () => { handReady = false; });
canvas.addEventListener('touchend',   () => { handReady = false; finger.speed = 0; });

// ── Button listeners ──────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const startBtn   = el('startBtn');
  const restartBtn = el('restartBtn');
  
  if (startBtn) {
    startBtn.addEventListener('click', () => { 
      ensureAudio(); 
      
      if (!cameraInitialized && typeof Hands !== 'undefined' && typeof Camera !== 'undefined') {
        setupMediaPipe(() => {
          startGame();
        });
      } else {
        if (typeof Hands === 'undefined') {
          setCamStatus('🖱 Touch / mouse mode', true);
        }
        startGame(); 
      }
    });
  }
  
  if (restartBtn) {
    restartBtn.addEventListener('click', () => { 
      ensureAudio(); 
      startGame(); 
    });
  }
});

// ── Init ──────────────────────────────────────────────────────────────────────
loop(); 
</script>
